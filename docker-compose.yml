services:
  postgres:
    image: postgres:16-alpine
    container_name: qrcb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-qrcb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qrcb_dev_password}
      POSTGRES_DB: ${DB_NAME:-qrcb_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [qrcb-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qrcb} -d ${DB_NAME:-qrcb_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qrcb-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-qrcb_dev_redis} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [qrcb-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qrcb_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: qrcb-rustfs
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      RUSTFS_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qrcb_dev_minio_root}
      RUSTFS_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [qrcb-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: qrcb-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-qrcb_dev_minio_root}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
    entrypoint: >
      /bin/sh -c "
        echo 'Creating buckets...';
        aws --endpoint-url http://rustfs:9000 s3 mb s3://qrcb-public || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://qrcb-private || true;
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-acl --bucket qrcb-public --acl public-read || true;
        echo 'Buckets created';
      "
    networks: [qrcb-net]
    restart: "no"

  api:
    build: .
    container_name: qrcb-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    ports:
      - "5001:5000"
    networks: [qrcb-net]

  nginx:
    image: nginx:alpine
    container_name: qrcb-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "8080:80"
    depends_on: [api]
    networks: [qrcb-net]

volumes:
  pgdata:
  redis-data:
  rustfs-data:

networks:
  qrcb-net:
    driver: bridge