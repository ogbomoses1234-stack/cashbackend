upstream api_backend { server api:5000; }

# Public API — api.yourdomain.com (dev: localhost:8080)
server {
    listen 80;
    server_name api.yourdomain.com localhost;

    location /api/public/ {
        proxy_pass http://api_backend/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        proxy_pass http://api_backend/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/health {
        proxy_pass http://api_backend/api/health;
    }
}
