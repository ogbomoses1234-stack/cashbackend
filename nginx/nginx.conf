# ═══════════════════════════════════════════════════════════
# Frontend server block
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.
# Uses the default nginx:alpine main config (no overrides needed).
# ═══════════════════════════════════════════════════════════

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hide nginx version
    server_tokens off;

    # ═══════════════════════════════════════════════════
    # BOT / SCANNER BLOCKLIST
    # Returning 444 closes the TCP connection with no
    # response — bots learn nothing, waste their own time.
    # ═══════════════════════════════════════════════════
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|acunetix|nessus|openvas|w3af|dirbuster|gobuster|wfuzz|hydra|metasploit|zgrab|semrush|ahrefs|mj12bot|dotbot|petalbot|bytespider|blexbot|serpstatbot|megaindex|python-httpx|python-requests)) {
        return 444;
    }

    # ═══════════════════════════════════════════════════
    # SECURITY HEADERS
    # ═══════════════════════════════════════════════════
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;

    # ═══════════════════════════════════════════════════
    # HEALTH CHECK — silent, no logging, no version leak
    # ═══════════════════════════════════════════════════
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ═══════════════════════════════════════════════════
    # BAD PATH BLOCKLIST — WordPress probes, dev artifacts,
    # credential scans, admin panels. All return 444.
    # ═══════════════════════════════════════════════════

    # WordPress / CMS
    location ~* ^/(wp-|wordpress|xmlrpc\.php|wlwmanifest\.xml)   { return 444; }
    location ~* /(wp-includes|wp-content|wp-admin)/               { return 444; }

    # Env / git / svn / mercurial
    location ~* \.env(\..+)?$                                     { return 444; }
    location ~* /\.(git|svn|hg)(/|$)                              { return 444; }

    # Config / backup / database files
    location ~* /config\.(php|bak|old|save|swp)$                  { return 444; }
    location ~* \.(bak|old|orig|save|swp|swo|sql|db|log|tar|zip|gz)$ { return 444; }

    # Admin panels
    location ~* ^/(phpinfo|phpmyadmin|adminer|pma|myadmin)        { return 444; }

    # Build tooling files
    location ~* /(docker-compose\.ya?ml|Dockerfile|Makefile|composer\.(json|lock)|yarn\.lock|package-lock\.json)$ { return 444; }

    # Hidden dotfiles
    location ~* /\.(htaccess|htpasswd|DS_Store)$                  { return 444; }

    # ═══════════════════════════════════════════════════
    # FAVICON — browsers auto-request .ico; serve our SVG
    # instead so no 404 gets logged.
    # ═══════════════════════════════════════════════════
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.svg =204;
    }

    # ═══════════════════════════════════════════════════
    # HASHED ASSETS — Vite emits content-hashed filenames,
    # so cache them 1 year and skip logging.
    # ═══════════════════════════════════════════════════
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ═══════════════════════════════════════════════════
    # STATIC MEDIA — logos, fonts, images
    # ═══════════════════════════════════════════════════
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ═══════════════════════════════════════════════════
    # DENY ALL DOTFILES
    # ═══════════════════════════════════════════════════
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ═══════════════════════════════════════════════════
    # SPA FALLBACK — everything else serves index.html
    # so /login, /products, /wallet, /chat/:id all work
    # ═══════════════════════════════════════════════════
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}